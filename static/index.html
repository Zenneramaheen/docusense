<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocuSense — Ask your documents</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 2rem; margin: 0; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin-top: .25rem; }
  .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-top: 1.25rem; }
  .card h2 { margin: 0 0 .75rem; font-size: 1.05rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type="text"], select { flex: 1; min-width: 200px; padding: .6rem .8rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); }
  button { padding: .6rem 1.1rem; border-radius: 8px; border: none; background: var(--accent); color: #082f49; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: #f87171; border: 1px solid #f87171; padding: .3rem .7rem; font-size: .8rem; }
  button:disabled { opacity: .5; cursor: wait; }
  .doc { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #334155; font-size: .9rem; }
  .doc:last-child { border-bottom: none; }
  .doc small { color: var(--muted); }
  .answer { font-size: 1.15rem; background: #0f172a; border-left: 3px solid var(--accent); padding: .8rem 1rem; border-radius: 0 8px 8px 0; margin: .75rem 0; }
  .conf { font-size: .8rem; color: var(--muted); }
  .src { border: 1px solid #334155; border-radius: 8px; padding: .7rem .9rem; margin-top: .6rem; font-size: .88rem; }
  .src .meta { color: var(--accent); font-size: .78rem; margin-bottom: .3rem; }
  .mode { display: inline-block; font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #334155; color: var(--muted); margin-left: .5rem; }
  .err { color: #f87171; font-size: .9rem; margin-top: .5rem; }
  .hint { font-size: .82rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Docu<span>Sense</span></h1>
  <p class="sub">Upload PDFs, then ask questions — answers come with cited sources.</p>

  <div class="card">
    <h2>1. Upload a PDF</h2>
    <div class="row">
      <input type="file" id="file" accept=".pdf" />
      <button id="uploadBtn" onclick="upload()">Upload &amp; index</button>
    </div>
    <div id="uploadMsg" class="hint"></div>
  </div>

  <div class="card">
    <h2>2. Your documents</h2>
    <div id="docs"><p class="hint">No documents yet.</p></div>
  </div>

  <div class="card">
    <h2>3. Ask a question</h2>
    <div class="row">
      <input type="text" id="q" placeholder="e.g. How many annual leave days do employees get?" />
      <select id="docFilter"><option value="">All documents</option></select>
    </div>
    <div class="row" style="margin-top:.6rem">
      <button id="askBtn" onclick="ask()">Ask</button>
    </div>
    <div id="result"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function refreshDocs() {
  const res = await fetch('/documents');
  const docs = await res.json();
  const box = $('docs'), sel = $('docFilter');
  sel.innerHTML = '<option value="">All documents</option>';
  if (!docs.length) { box.innerHTML = '<p class="hint">No documents yet.</p>'; return; }
  box.innerHTML = '';
  docs.forEach(d => {
    const div = document.createElement('div');
    div.className = 'doc';
    div.innerHTML = `<span><b>${d.name}</b> <small>· ${d.num_pages} pages · ${d.num_chunks} chunks</small></span>`;
    const btn = document.createElement('button');
    btn.className = 'danger'; btn.textContent = 'Delete';
    btn.onclick = async () => { await fetch('/documents/' + d.id, {method: 'DELETE'}); refreshDocs(); };
    div.appendChild(btn);
    box.appendChild(div);
    const opt = document.createElement('option');
    opt.value = d.id; opt.textContent = d.name;
    sel.appendChild(opt);
  });
}

async function upload() {
  const f = $('file').files[0];
  if (!f) { $('uploadMsg').textContent = 'Pick a PDF first.'; return; }
  const btn = $('uploadBtn'); btn.disabled = true;
  $('uploadMsg').textContent = 'Uploading, chunking and embedding… (first run downloads the model)';
  const fd = new FormData(); fd.append('file', f);
  try {
    const res = await fetch('/documents/upload', {method: 'POST', body: fd});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    $('uploadMsg').textContent = `Indexed "${data.name}": ${data.num_chunks} chunks from ${data.num_pages} pages.`;
    $('file').value = '';
    refreshDocs();
  } catch (e) { $('uploadMsg').innerHTML = `<span class="err">${e.message}</span>`; }
  btn.disabled = false;
}

async function ask() {
  const q = $('q').value.trim();
  if (!q) return;
  const btn = $('askBtn'); btn.disabled = true;
  $('result').innerHTML = '<p class="hint">Retrieving passages and reading them…</p>';
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, doc_id: $('docFilter').value || null, top_k: 5})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Ask failed');
    const modeLabel = data.mode === 'extractive-qa' ? 'extractive QA' : 'retrieval-only fallback';
    let html = `<span class="mode">${modeLabel}</span>`;
    html += data.answer
      ? `<div class="answer">${escapeHtml(data.answer)}</div><div class="conf">Confidence: ${(data.confidence * 100).toFixed(1)}%</div>`
      : `<div class="answer">No direct answer found — here are the most relevant passages:</div>`;
    html += '<h3 style="font-size:.95rem;margin:1rem 0 .25rem">Sources</h3>';
    data.sources.forEach(s => {
      html += `<div class="src"><div class="meta">${escapeHtml(s.doc_name)} · page ${s.page} · similarity ${s.score.toFixed(3)}</div>${escapeHtml(s.excerpt)}…</div>`;
    });
    $('result').innerHTML = html;
  } catch (e) { $('result').innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`; }
  btn.disabled = false;
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
refreshDocs();
</script>
</body>
</html>
